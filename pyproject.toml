[project]
name = "telecom-churn-prediction"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "D_SAI_KIRAN_REDDY", email = "dasappagarisaikiranreddy@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "catboost>=1.2.10",
    "jupyter>=1.1.1",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "optuna>=5.0.0",
    "pandas>=3.1.0",
    "pathlib>=1.0.1",
    "python-box>=8.0.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "shap>=0.51.0",
    "xgboost>=3.2.0",
]

[project.scripts]
telecom-churn-prediction = "telecom_churn:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "telecom_churn"
module-root = "src"
